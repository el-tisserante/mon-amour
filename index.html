<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cette ligne magique empêche le blocage des images (hotlinking) -->
    <meta name="referrer" content="no-referrer"> 
    <title>Pour Toi ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #accueil {
            text-align: center;
            z-index: 10;
            transition: opacity 1s ease;
        }

        h1 {
            color: #ff66b2;
            font-size: 2.5rem;
            margin-bottom: 40px;
            padding: 0 20px;
            text-shadow: 0 0 10px rgba(255, 102, 178, 0.5);
        }

        button {
            background-color: #ff66b2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 102, 178, 0.6);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #ff3399;
        }

        .petit-stitch {
            position: absolute;
            width: 100px; 
            opacity: 0;
            animation: apparaitreDisparaitre 3s forwards;
            pointer-events: none;
        }

        @keyframes apparaitreDisparaitre {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            20% { opacity: 1; transform: scale(1) translateY(0); }
            80% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.5) translateY(-20px); }
        }

        #gros-stitch-container {
            display: none;
            position: absolute;
            z-index: 20;
            text-align: center;
            cursor: pointer;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #gros-stitch-container img {
            width: 350px;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 15px rgba(255, 102, 178, 0.4));
        }

        #gros-stitch-container img:hover {
            transform: scale(1.05) rotate(2deg);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #lettre-container {
            display: none;
            position: absolute;
            z-index: 30;
            background-color: #fff9f9;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 85%;
            box-shadow: 0 0 30px rgba(255, 102, 178, 0.8);
            color: #333;
            animation: ouvrirLettre 0.8s ease forwards;
        }

        @keyframes ouvrirLettre {
            0% { transform: translateY(50px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        #texte-lettre {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="accueil">
        <h1>Parfois je suis maladroit, mais toujours je suis amoureux</h1>
        <button id="btn-commencer">Clique ici ❤️</button>
    </div>

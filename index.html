<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> 
    <title>Pour Toi ❤️</title>
    <style>
        /* Réinitialisation de base */
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ÉCRAN 1 : ACCUEIL --- */
        #accueil {
            position: absolute;
            z-index: 100; /* Forcé au premier plan */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            transition: opacity 1s ease;
        }

        h1 {
            color: #ff66b2;
            font-size: 2.5rem;
            margin: 0;
            padding: 0 20px;
            text-shadow: 0 0 10px rgba(255, 102, 178, 0.5);
        }

        button {
            background-color: #ff66b2;
            color: #000000;
            font-weight: bold;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 102, 178, 0.6);
            transition: transform 0.2s, background-color 0.2s;
            pointer-events: auto; /* Assure que le clic est détecté */
        }

        button:hover {
            transform: scale(1.1);
            background-color: #ff3399;
        }

        /* --- ÉCRAN 2 : PETITS STITCHS --- */
        .petit-stitch {
            position: absolute;
            width: 80px;
            opacity: 0;
            z-index: 50;
            animation: popAndFade 2.5s forwards;
            pointer-events: none; /* Crucial : empêche les images de bloquer les clics */
        }

        @keyframes popAndFade {
            0% { opacity: 0; transform: scale(0.1) translateY(20px); }
            30% { opacity: 1; transform: scale(1.2) translateY(0); }
            70% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.5) translateY(-20px); }
        }

        /* --- ÉCRAN 3 : GROS STITCH --- */
        #gros-stitch-container {
            display: none;
            position: absolute;
            z-index: 150;
            cursor: pointer;
            animation: apparitionGros 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #gros-stitch-container img {
            width: 300px;
            max-width: 80vw;
            filter: drop-shadow(0 0 20px rgba(255, 102, 178, 0.5));
            transition: transform 0.3s;
            pointer-events: auto; /* Rend l'image cliquable */
        }

        #gros-stitch-container img:hover {
            transform: scale(1.05) rotate(3deg);
        }

        @keyframes apparitionGros {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- ÉCRAN 4 : LA LETTRE --- */
        #lettre-container {
            display: none;
            position: absolute;
            z-index: 200;
            background-color: #fff9f9;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto; /* Permet de scroller si le texte est très long */
            box-shadow: 0 0 40px rgba(255, 102, 178, 0.8);
            color: #222;
            animation: slideUp 0.8s ease forwards;
        }

        @keyframes slideUp {
            0% { transform: translateY(100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        #texte-lettre {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="accueil">
        <h1>Parfois je suis maladroit, mais toujours je suis amoureux</h1>
        <button id="btn-commencer">Clique ici ❤️</button>
    </div>

    <div id="gros-stitch-container">
        <!-- Serveur ultra-stable (Wikimedia) -->
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d2/Stitch_%28Lilo_%26_Stitch%29.svg/512px-Stitch_%28Lilo_%26_Stitch%29.svg.png" alt="Gros Stitch" id="img-enveloppe">
    </div>

    <div id="lettre-container">
        <div id="texte-lettre"></div>
    </div>

    <script>
        // --- DONNÉES ---
        const URL_PETIT_STITCH = "https://upload.wikimedia.org/wikipedia/en/thumb/d/d2/Stitch_%28Lilo_%26_Stitch%29.svg/128px-Stitch_%28Lilo_%26_Stitch%29.svg.png";
        
        const MESSAGE_LETTRE = `Mon amour,
Je prends ces quelques instants pour t’écrire ce que j'ai au plus profond du cœur. Même si les choses s'apaisent doucement et qu'on retrouve petit à petit notre rythme, j'ai ce besoin de te redire à quel point tu es essentielle pour moi.
Je n'ai pas envie de repenser à ce qui a pu nous secouer, ce qui m'importe aujourd'hui, c'est uniquement là où on va. Regarder devant, ensemble. Te voir sourire, retrouver cette complicité unique qu'on a tous les deux et construire au quotidien tout ce qu'on mérite de vivre. Tu occupes toute ma tête et tout mon espace, et l'envie que j'ai de toi, de tes bras, de nos moments à deux, est plus forte que jamais. Pas une seconde ne passe sans que tu me manques et sans que je te veuilles à mes cotés pour tout partager.
Je veux que tu n'aies jamais le moindre doute là-dessus, je suis là, près de toi, et je ne t'abandonnerai jamais. Quels que soient les obstacles, les doutes ou les étapes qu'on aura à franchir, c'est ta main que je veux. 
Tu es ma priorité, ma partenaire, et la personne avec qui je veux tout partager.
Prenons le temps d'avancer à notre rythme, de savourer chaque instant qui revient, mais sache que mon engagement et mon amour pour toi sont inébranlables. Je t'aime profondément et du fond du coeur.

Ton homme`;

        // --- LOGIQUE ---
        document.addEventListener('DOMContentLoaded', () => {
            const accueil = document.getElementById('accueil');
            const btnCommencer = document.getElementById('btn-commencer');
            const grosStitchContainer = document.getElementById('gros-stitch-container');
            const imgEnveloppe = document.getElementById('img-enveloppe');
            const lettreContainer = document.getElementById('lettre-container');
            const texteLettre = document.getElementById('texte-lettre');

            let intervalStitch;

            // Étape 1 : Clic sur le bouton de départ
            btnCommencer.addEventListener('click', () => {
                // Désactive immédiatement l'accueil pour éviter les bugs de clics multiples
                accueil.style.pointerEvents = 'none';
                accueil.style.opacity = '0';
                
                setTimeout(() => {
                    accueil.style.display = 'none';
                }, 1000);

                // Démarre la pluie d'images
                intervalStitch = setInterval(creerPetitStitch, 250);

                // Arrête la pluie et affiche le bouton final après 4.5s
                setTimeout(() => {
                    clearInterval(intervalStitch);
                    setTimeout(() => {
                        grosStitchContainer.style.display = 'block';
                    }, 1500); // Laisse le temps aux derniers petits stitchs de disparaître
                }, 4500);
            });

            // Fonction de génération d'images aléatoires
            function creerPetitStitch() {
                const stitch = document.createElement('img');
                stitch.src = URL_PETIT_STITCH;
                stitch.classList.add('petit-stitch');
                
                const maxWidth = window.innerWidth - 100;
                const maxHeight = window.innerHeight - 100;
                const x = Math.max(0, Math.random() * maxWidth);
                const y = Math.max(0, Math.random() * maxHeight);
                
                stitch.style.left = `${x}px`;
                stitch.style.top = `${y}px`;
                
                document.body.appendChild(stitch);

                // Détruit l'élément du code une fois l'animation terminée (optimisation mémoire)
                setTimeout(() => {
                    if (stitch.parentNode) {
                        stitch.remove();
                    }
                }, 2500);
            }

            // Étape 2 : Clic sur le gros Stitch pour ouvrir la lettre
            imgEnveloppe.addEventListener('click', () => {
                grosStitchContainer.style.pointerEvents = 'none';
                grosStitchContainer.style.opacity = '0';
                
                setTimeout(() => {
                    grosStitchContainer.style.display = 'none';
                    texteLettre.textContent = MESSAGE_LETTRE;
                    lettreContainer.style.display = 'block';
                }, 300);
            });
        });
    </script>
</body>
</html>
